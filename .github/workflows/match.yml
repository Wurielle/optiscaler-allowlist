name: Match Store IDs

on:
  push:
    paths:
      - "data/providers/**"
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: match
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run store matcher
        run: npx tsx src/index.ts match

      - name: Commit updated store mappings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stores/
          if git diff --cached --quiet; then
            echo "No changes to store mappings"
          else
            git commit -m "Update store mappings $(date -u +%Y-%m-%d)"
            git push
          fi
